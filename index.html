<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KongStreaming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111827;color:white;font-family:Arial,Helvetica,sans-serif;padding:20px;}
h1{text-align:center;color:#facc15;margin-bottom:10px;}
.total{text-align:center;margin-bottom:20px;color:#ccc;}
#buscar{width:100%;padding:15px;border:none;border-radius:10px;font-size:18px;margin-bottom:25px;}
.categoria{margin-top:35px;}
.categoria h2{background:#222;padding:12px;border-left:5px solid #facc15;margin-bottom:15px;}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.card{background:#1f2937;border-radius:10px;overflow:hidden;transition:.2s;cursor:pointer;}
.card:hover{transform:scale(1.03);}
.card.seleccionada{border:3px solid #22c55e;}
.card img{width:100%;height:320px;object-fit:contain;display:block;background:#111;}
.info{padding:8px;display:flex;justify-content:space-between;align-items:flex-end;}
.datos{flex:1;}
.titulo{font-size:13px;font-weight:bold;line-height:1.3;margin-bottom:4px;}
.anio{color:#ccc;font-size:12px;margin-bottom:4px;}
.estado{color:#facc15;font-size:11px;font-weight:bold;}
.precio{font-size:24px;font-weight:bold;color:#fff7d6;line-height:1;white-space:nowrap;}
.boton-whatsapp{
position:fixed;bottom:20px;right:20px;background:#25D366;color:white;
border:none;border-radius:50px;padding:15px 20px;font-size:16px;
font-weight:bold;cursor:pointer;z-index:9999;
}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){
.grid{grid-template-columns:repeat(3,1fr);}
.card img{height:180px;}
.precio{font-size:20px;}
}
</style>
</head>
<body>

<h1>🎬 KongStreaming</h1>
<div class="total" id="total"></div>

<input type="text" id="buscar" placeholder="Buscar película...">

<div id="catalogo"></div>

<button class="boton-whatsapp" onclick="enviarWhatsApp()">
📲 Pedir por WhatsApp
</button>

<script>
let peliculas=[];
let seleccionadas=[];

fetch("peliculas.json?v=" + Date.now())
.then(r => r.json())
.then(data => {
    peliculas = data;
    fetch("novedades.json?v=" + Date.now())
      .then(r=>r.json())
      .then(n=>{novedades=n; actualizarContador(); mostrar("");})
      .catch(()=>{novedades=[]; actualizarContador(); mostrar("");});
});

function actualizarContador(){
    document.getElementById("total").textContent =
    "Seleccionadas: "+seleccionadas.length+" | Total catálogo: "+peliculas.length;
}

function mostrar(texto){
    const contenedor=document.getElementById("catalogo");
    contenedor.innerHTML="";

    if(novedades && novedades.length>0){
      const listaN=peliculas.filter(p=>novedades.includes(p.titulo) && limpiar(p.titulo).includes(limpiar(texto))).sort((a,b)=>novedades.indexOf(a.titulo)-novedades.indexOf(b.titulo));
      if(listaN.length){
        const bloque=document.createElement("div");
        bloque.className="categoria";
        bloque.innerHTML=`<h2>🔥 NOVEDADES (${listaN.length})</h2><div class="grid"></div>`;
        const grid=bloque.querySelector(".grid");
        listaN.forEach(p=>{
          const card=document.createElement("div"); card.className="card"; if(seleccionadas.includes(p.titulo)) card.classList.add("seleccionada");
          card.innerHTML=`<img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'"><div class="info"><div class="datos"><div class="titulo">${p.titulo}</div><div class="anio">${p.anio}</div><div class="estado">${p.categoria === "cine" ? p.estado : "HD • " + p.estado}</div></div><div class="precio">$${p.categoria === "cine" ? 20 : 15}</div></div>`;
          card.onclick=()=>{if(seleccionadas.includes(p.titulo)){seleccionadas=seleccionadas.filter(x=>x!==p.titulo);card.classList.remove("seleccionada");}else{seleccionadas.push(p.titulo);card.classList.add("seleccionada");}actualizarContador();};
          grid.appendChild(card);
        });
        contenedor.appendChild(bloque);
      }
    }

    let novedades=[];
fetch("novedades.json?v=" + Date.now()).then(r=>r.json()).then(n=>n).catch(()=>[]);
const categorias=["cine","2026","2025","2024"];

    categorias.forEach(cat=>{
        const lista=peliculas.filter(p=>
    p.categoria===cat &&
    limpiar(p.titulo).includes(limpiar(texto))
);

        if(lista.length===0) return;

        let titulo="";
        if(cat==="cine") titulo="🎥 EN CINE";
        if(cat==="2026") titulo="⭐ 2026 - CALIDAD FINAL";
        if(cat==="2025") titulo="⭐ 2025 - CALIDAD FINAL";
        if(cat==="2024") titulo="⭐ 2024 - CALIDAD FINAL";

        const bloque=document.createElement("div");
        bloque.className="categoria";
        bloque.innerHTML=`<h2>${titulo} (${lista.length})</h2><div class="grid"></div>`;

        const grid=bloque.querySelector(".grid");

        lista.forEach(p=>{
            const card=document.createElement("div");
            card.className="card";

            if(seleccionadas.includes(p.titulo)){
                card.classList.add("seleccionada");
            }

            card.innerHTML=`
            <img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'">
            <div class="info">
                <div class="datos">
                    <div class="titulo">${p.titulo}</div>
                    <div class="anio">${p.anio}</div>
                    <div class="estado">${p.categoria === "cine" ? p.estado : "HD • " + p.estado}</div>
                </div>
                <div class="precio">$${p.categoria === "cine" ? 20 : 15}</div>
            </div>`;

            card.onclick=()=>{
                if(seleccionadas.includes(p.titulo)){
                    seleccionadas=seleccionadas.filter(x=>x!==p.titulo);
                    card.classList.remove("seleccionada");
                }else{
                    seleccionadas.push(p.titulo);
                    card.classList.add("seleccionada");
                }
                actualizarContador();
            };

            grid.appendChild(card);
        });

        contenedor.appendChild(bloque);
    });
}

document.getElementById("buscar").addEventListener("input",e=>{
    mostrar(e.target.value);
});


function limpiar(texto){
    return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9 ]/g, "")
        .toLowerCase()
        .trim();
}

function enviarWhatsApp(){

    if(seleccionadas.length===0){
        alert("Selecciona al menos una película");
        return;
    }

    let mensaje = "🎬 Pedido KongStreaming\n\nPelículas seleccionadas:\n\n";

    let total = 0;
    let normales = 0;
    let cine = 0;

    seleccionadas.forEach(nombre=>{

        const peli = peliculas.find(
            x => limpiar(x.titulo) === limpiar(nombre)
        );

        if(peli){

            let extra = "";

            if(peli.categoria === "cine"){
                extra = " (EN CINE)";
                total += 20;
                cine++;
            }else{
                extra = " (" + peli.anio + ")";
                total += 15;
                normales++;
            }

            mensaje += "• " + peli.titulo + extra + "\n";
        }

    });

    mensaje += "\n📊 Resumen:\n";

    if(normales > 0){
        mensaje += "🎬 Películas normales: " + normales + " x $15 = $" + (normales * 15) + "\n";
    }

    if(cine > 0){
        mensaje += "🍿 Estrenos EN CINE: " + cine + " x $20 = $" + (cine * 20) + "\n";
    }

    mensaje += "\n🎞️ Total de películas: " + seleccionadas.length;
    mensaje += "\n\n💰 Total a pagar: $" + total + " MXN";

    window.open(
    "https://wa.me/525516421959?text=" + encodeURIComponent(mensaje),
    "_blank"
);
}
</script>

</body>
</html>
